{% extends "base.html" %}
{% block content %}
<div class="card small">
<h1>Login</h1>
<form method="post">
    <label>Username</label>
    <input name="username" required>
    <label>Password</label>
    <input name="password" type="password" required>
    <button>Login</button>
</form>
<p>New user? <a href="{{ url_for('register') }}">Create account</a></p>
</div>
{% endblock %}
